# The identities devflow's model steps run as, in the shape of config/principals.yaml.
# `principals.py apply` (scripts/up.sh) creates it and mints its credential.
#
# A reviewer reads the frozen materials and writes its own review file — nothing else. It may not
# edit anything, and it may not write anything but /ws/<run>/review_r<n>.json: the materials it
# judges, and the workspace that holds the evaluation, are not its to change.
#
# This is a tool right, not independence. Independence is decided by dfcore.is_independent from
# who implemented the change; a different model or vendor is never counted as independence.
principals:
  devflow-reviewer:
    # The providers and nothing else: a reviewer reads frozen materials, so what the shared list
    # holds open for other packages (GitHub included) is not something its work uses. Brokered
    # (agent-stack §53–§55): the review runs in the `closed` profile's container on its own network,
    # which every vendor's CLI tolerates — the uid problem that once refused codex here is gone by
    # construction, measured on all three vendors (§55).
    egress_profile: closed
    description: >
      devflow's model reviewer. Reads the frozen review materials; writes only its own review file.
    tool_rules:
      write_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/review_r')"
          rule_description: a reviewer writes its own review file
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else
      edit_file:
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: a reviewer changes nothing it reads

  devflow-implementer:
    # The providers and nothing else: the implementer builds on research records the research lane
    # wrote and a reviewer passed, so it fetches nothing itself — and cannot reach what the shared
    # list holds open for other packages, GitHub included (devflow's scripts do the GitHub work).
    # Brokered into the `closed` profile (agent-stack §53–§55). Its steps still run on claude only
    # (impl_profile long-task) — not confinement any more, but codex's own writing: it reached for
    # its own edit tool (which waits for a person) and its one MCP-written file held "undefined"
    # (both measured 2026-09-25).
    egress_profile: closed
    description: >
      devflow's implementer. Writes the task's change in the run's checkout (/ws/<run>/repo/) and its
      own report (devflow/prepare.json, devflow/implement.json) — nothing else. Which paths of the
      project it may change is decided again, by the project's canonical rules, before anything is
      pushed (steps/deliver.py); this right only keeps it inside its own workspace.
    tool_rules:
      # one condition per rule: a `simple` condition is a single test (measured — an `a || b` rule
      # matched nothing, and every write fell through to the deny)
      write_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/repo/')"
          rule_description: the implementer writes the checkout
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/devflow/prepare.json')"
          rule_description: and preparation's report
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/devflow/implement.json')"
          rule_description: and the implementation's report
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else
      edit_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/repo/')"
          rule_description: the implementer edits the checkout
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else

  devflow-researcher:
    # The research lane's role (task types research and survey). Its profile's hosts are primary
    # sources for how an operating system packages a product: the distributions' package indexes and
    # their vendors' documentation (agent-stack docker/egress/profiles/research.allow). Only WebFetch
    # is held to them — WebSearch runs at the provider, which no proxy here can limit. Claude only
    # (impl_profile long-task): codex's own writing failed twice, measured 2026-09-25.
    egress_profile: research
    description: >
      devflow's researcher. Writes the research record in the run's checkout (/ws/<run>/repo/) and its
      own report (devflow/research.json) — nothing else. Which paths it may change is decided again,
      by the project's canonical rules, before anything is pushed.
    tool_rules:
      write_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/repo/')"
          rule_description: the researcher writes the checkout
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/devflow/research.json')"
          rule_description: and its report
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else
      edit_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/repo/')"
          rule_description: the researcher edits the checkout
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else

  devflow-research-reviewer:
    # Reviews what the research lane wrote, given what its author was given: the same hosts (a record
    # of facts from the web is checked against the web, not only for its form — measured: a reviewer
    # without them could check provenance and consistency and nothing else), the same reference
    # material and the criterion's own words. An identity of its own, never the researcher's — and a
    # *profile* of its own with the same list (research-review.allow), because two roles in one
    # profile can steal each other's live job tokens (agent-stack §54), and the reviewer judging the
    # researcher is exactly the pair that must not.
    egress_profile: research-review
    description: >
      devflow's reviewer for research records. Reads the frozen materials and the listed hosts; writes
      only its own review file.
    tool_rules:
      write_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/review_r')"
          rule_description: a reviewer writes its own review file
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else
      edit_file:
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: a reviewer changes nothing it reads
