# The identities devflow's model steps run as, in the shape of config/principals.yaml.
# `principals.py apply` (scripts/up.sh) creates it and mints its credential.
#
# A reviewer reads the frozen materials and writes its own review file — nothing else. It may not
# edit anything, and it may not write anything but /ws/<run>/review_r<n>.json: the materials it
# judges, and the workspace that holds the evaluation, are not its to change.
#
# This is a tool right, not independence. Independence is decided by dfcore.is_independent from
# who implemented the change; a different model or vendor is never counted as independence.
principals:
  devflow-reviewer:
    description: >
      devflow's model reviewer. Reads the frozen review materials; writes only its own review file.
    tool_rules:
      write_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/review_r')"
          rule_description: a reviewer writes its own review file
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else
      edit_file:
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: a reviewer changes nothing it reads

  devflow-implementer:
    description: >
      devflow's implementer. Writes the task's change in the run's checkout (/ws/<run>/repo/) and its
      own report (devflow/prepare.json, devflow/implement.json) — nothing else. Which paths of the
      project it may change is decided again, by the project's canonical rules, before anything is
      pushed (steps/deliver.py); this right only keeps it inside its own workspace.
    tool_rules:
      # one condition per rule: a `simple` condition is a single test (measured — an `a || b` rule
      # matched nothing, and every write fell through to the deny)
      write_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/repo/')"
          rule_description: the implementer writes the checkout
        - action: allow
          condition_type: simple
          condition_expression: "args.path.endsWith('/devflow/prepare.json')"
          rule_description: and preparation's report
        - action: allow
          condition_type: simple
          condition_expression: "args.path.endsWith('/devflow/implement.json')"
          rule_description: and the implementation's report
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else
      edit_file:
        - action: allow
          condition_type: simple
          condition_expression: "args.path.contains('/repo/')"
          rule_description: the implementer edits the checkout
        - action: deny
          condition_type: simple
          condition_expression: ""
          rule_description: and nothing else
