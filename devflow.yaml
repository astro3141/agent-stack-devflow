# devflow: one pass over one task. Each run reads the task's state from GitHub, advances it as far
# as the evidence allows, publishes the state back to GitHub, and ends — so "resume" is simply the
# next run, and nothing the task depends on lives in this runner between runs.
#
#   evaluate ──need models──▶ route ─ROUTE─▶ review_plan ─▶ reviews ─┐
#      │                        └─HOLD──────────────────────────────┤
#      └────────────────────────────────────────────────────────────▶ adjudicate
#   adjudicate ─▶ act ─prepare/implement─▶ route_impl ─ROUTE─▶ work ─▶ prepare_agent ─▶ proceed ─┐
#                  │                                            └──────▶ implement_agent ◀──────┤
#                  │                                                          └─▶ deliver ◀──────┘
#                  ├─research (task types in implement.modes)─▶ route_impl ─▶ work ─▶ research_agent ─▶ deliver
#                  ├─rebase──────────────────────────────────────▶ work ─────▶ deliver ─┐
#                  ├─PASS on head / done─▶ integrate ────────────────────────────────────┤
#                  └───────────────────────────────────────────────────────────────────▶ publish ─▶ record ─▶ ended_*
#
# act decides whether devflow's own implementer acts in this pass (the project's policy says
# `implement.by: agent`, the verdict sent the task to implementation, rounds are left). Its model
# steps run as the principal devflow-implementer; what they wrote is checked against the canonical
# rules, the project's generators run, and one commit is pushed to devflow/<task id> — which ends
# the pass, waiting for CI on that head. The next pass (devflow-auto starts it) judges it.
#
# Research is a lane of its own: a task whose type the project routes to `implement.modes`
# (research, survey) is one model step as devflow-researcher — the only devflow role whose egress
# profile carries web hosts (agent-stack §53–§55) — writing a record into the project's research
# directory and nothing else. It is reviewed and merged like any change; item tasks then build on
# the merged records, and their implementer (profile `closed`: the providers only) fetches nothing.
# Every devflow model step is brokered: its role's profile decides its network, and the broker
# holds the credential. The three steps below call broker_dispatch.py themselves (agent_task.py's
# argv, the other door): the stack swaps the door only inside tasks.py and task_chain.py, and a
# workflow step that names agent_task.py directly ran in the main agent on the shared list —
# measured: the researcher's rework call, outside its profile, on the list that holds GitHub open.
#
# Every edge is decided deterministically from a step's output (no model chooses a route).
workflow:
  name: devflow
  description: Advance one development task (a GitHub issue) through 준비·구현·검증·리뷰·통합·완료
  entry_point: evaluate
  input:
    profile:
      type: string
      required: false
      default: research-default
      description: execution profile — which provider may run a model review, under which quota
    project:
      type: string
      required: true
      description: a project registered in config/devflow/projects/<project>.yaml
    issue:
      type: string
      required: true
      description: the task's issue number (its body carries the ```devflow task block)
    fixture:
      type: string
      required: false
      default: ""
      description: fixture remote scenario (projects whose registration says remote fixture)
    review_mode:
      type: string
      required: false
      default: model
      description: "model | external — whether a model may supply a missing review in this run"
    reviewer:
      type: string
      required: false
      default: devflow-reviewer
      description: the principal a model review runs as
    impl_profile:
      type: string
      required: false
      default: long-task
      description: execution profile for devflow's implementer and researcher — claude only (codex reached for its own edit tool and wrote one file as "undefined", both measured)
  limits:
    max_iterations: 30
    timeout_seconds: 10800

agents:
  - name: evaluate
    type: script
    description: Fix the frame (repository, base/head, workflow and policy digests, criteria) and gather the evidence
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/evaluate.py", "{{ workflow.input.project }}",
           "{{ workflow.input.issue }}", "{{ workflow.input.fixture }}", "{{ workflow.input.review_mode }}"]
    timeout: 600
    output:
      status: {type: string}
      evaluation: {type: string}
      need_models: {type: string}
      assignments: {type: number}
      models: {type: string}
      merged: {type: string}
      frame: {type: string}
      head: {type: string}
      lane: {type: string}
      error: {type: string}
    routes:
      # a round whose assignments name their models (reviews.reviewer_models, distinct_models) is
      # admitted on exactly those; otherwise the router picks one from the profile
      - to: admit
        when: "{{ evaluate.output.need_models == 'yes' and evaluate.output.models != '' }}"
      - to: route
        when: "{{ evaluate.output.need_models == 'yes' }}"
      - to: adjudicate

  - name: route
    type: script
    description: Quota admission for the model reviews (a HOLD means no model review this run, not a verdict)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/stack/steps/route.py",
           "{% if evaluate.output.lane == 'research' %}{{ workflow.input.impl_profile }}{% else %}{{ workflow.input.profile }}{% endif %}"]
    output:
      decision: {type: string}
      provider: {type: string}
      reason: {type: string}
      evaluated: {type: string}
      model_route: {type: string}
      login: {type: string}
      profile: {type: string}
      evidence_dir: {type: string}
    routes:
      - to: review_plan
        when: "{{ route.output.decision == 'ROUTE' }}"
      - to: adjudicate

  - name: admit
    type: script
    description: A round whose reviewers are named models starts only when every one of them is usable
    command: "${POC_PY:-/opt/venv/bin/python}"
    # route.py picks one provider from a profile's candidates; a round that names its models (codex
    # for a research record; claude and codex where two must complete) asks about exactly those —
    # the stack's admit_models.py, with the profile's thresholds, reports and decides nothing:
    # holding is ours. The profile stays the one the calls execute under.
    args: ["/work/stack/steps/admit_models.py",
           "{% if evaluate.output.lane == 'research' %}{{ workflow.input.impl_profile }}{% else %}{{ workflow.input.profile }}{% endif %}",
           "{{ evaluate.output.models }}"]
    output:
      all_eligible: {type: boolean}
      eligible: {type: array}
      missing: {type: array}
      reason: {type: string}
      evaluated: {type: string}
      profile: {type: string}
    routes:
      - to: review_plan
        when: "{{ admit.output.all_eligible }}"
      - to: adjudicate

  - name: review_plan
    type: script
    description: One fan-out member per model review assignment, under the reviewer principal
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/review_plan.py",
           "{% if route is defined %}{{ route.output.provider }}{% endif %}",
           "{% if route is defined %}{{ route.output.login }}{% endif %}",
           "{% if route is defined %}{{ route.output.model_route }}{% else %}direct{% endif %}",
           "{% if evaluate.output.lane == 'research' %}devflow-research-reviewer{% else %}{{ workflow.input.reviewer }}{% endif %}"]
    output:
      status: {type: string}
      plan: {type: string}
      members: {type: number}
      context: {type: string}
    routes:
      - to: reviews
        when: "{{ review_plan.output.status == 'OK' }}"
      - to: adjudicate

  - name: reviews
    type: script
    description: The model reviews, started together; the receipt is bound to the frame id
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/stack/steps/tasks.py", "devflow/review_receipt.json", "{{ review_plan.output.context }}",
           "{% if route is defined %}{{ route.output.profile }}{% else %}{{ admit.output.profile }}{% endif %}",
           "--plan", "{{ review_plan.output.plan }}"]
    timeout: 1500
    output:
      status: {type: string}
      receipt: {type: string}
      tasks: {type: number}
      produced: {type: number}
      failed: {type: string}
      wall_s: {type: number}
    routes:
      - to: adjudicate

  - name: adjudicate
    type: script
    description: The task's phase, progress, execution status, review status and verdict — deterministic
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/adjudicate.py",
           "{% if reviews is defined %}{{ reviews.output.receipt }}{% endif %}",
           "{% if reviews is not defined and admit is defined and not admit.output.all_eligible %}{{ admit.output.reason }}{% elif reviews is not defined and route is defined and route.output.decision != 'ROUTE' %}{{ route.output.reason }}{% endif %}"]
    output:
      status: {type: string}
      verdict: {type: string}
      phase: {type: string}
      progress: {type: string}
      integrate: {type: string}
      reason: {type: string}
      next: {type: string}
      state: {type: string}
      model_calls: {type: number}
      error: {type: string}
    routes:
      - to: act

  - name: act
    type: script
    description: Whether devflow's own implementer acts on the task in this pass (deterministic)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/act.py"]
    output:
      do: {type: string}
      why: {type: string}
      error: {type: string}
    routes:
      - to: route_impl
        when: "{{ act.output.do in ['prepare', 'implement', 'research'] }}"
      - to: work
        when: "{{ act.output.do == 'rebase' }}"
      - to: integrate
        when: "{{ adjudicate.output.integrate == 'yes' or adjudicate.output.phase == 'done' }}"
      - to: publish

  - name: route_impl
    type: script
    description: Quota admission for the implementer (a HOLD leaves the task waiting for implementation)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/stack/steps/route.py", "{{ workflow.input.impl_profile }}"]
    output:
      decision: {type: string}
      provider: {type: string}
      reason: {type: string}
      evaluated: {type: string}
      model_route: {type: string}
      login: {type: string}
      profile: {type: string}
      evidence_dir: {type: string}
    routes:
      - to: work
        when: "{{ route_impl.output.decision == 'ROUTE' }}"
      - to: publish

  - name: work
    type: script
    description: The implementer's checkout, reference material, feedback and instructions for this round
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/work.py", "{{ workflow.input.project }}", "{{ act.output.do }}"]
    timeout: 900
    output:
      status: {type: string}
      stage: {type: string}
      workspace: {type: string}
      prompt_prepare: {type: string}
      prompt_implement: {type: string}
      prompt_research: {type: string}
      round: {type: number}
      error: {type: string}
    routes:
      - to: prepare_agent
        when: "{{ work.output.status == 'OK' and work.output.stage == 'prepare' }}"
      - to: implement_agent
        when: "{{ work.output.status == 'OK' and work.output.stage == 'implement' }}"
      - to: research_agent
        when: "{{ work.output.status == 'OK' and work.output.stage == 'research' }}"
      - to: deliver
        when: "{{ work.output.status == 'OK' and work.output.stage == 'rebase' }}"
      - to: publish

  - name: research_agent
    type: script
    description: 리서치 레인 — a research or survey record, as devflow-researcher (its own hosts, agent-stack §48)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/stack/steps/broker_dispatch.py", "{{ route_impl.output.provider }}",
           "{{ route_impl.output.model_route }}", "research", "{{ work.output.prompt_research }}",
           "devflow/research.json", "{{ route_impl.output.profile }}", "{{ route_impl.output.login }}",
           "devflow-researcher"]
    timeout: 3700
    output:
      status: {type: string}
      produced: {type: boolean}
      provider: {type: string}
      run_id: {type: string}
      failure: {type: string}
    routes:
      - to: deliver

  - name: prepare_agent
    type: script
    description: 준비 — the criteria mapping and trace, from the research records, as devflow-implementer
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/stack/steps/broker_dispatch.py", "{{ route_impl.output.provider }}",
           "{{ route_impl.output.model_route }}", "prepare", "{{ work.output.prompt_prepare }}",
           "devflow/prepare.json", "{{ route_impl.output.profile }}", "{{ route_impl.output.login }}",
           "devflow-implementer"]
    timeout: 3700
    output:
      status: {type: string}
      produced: {type: boolean}
      provider: {type: string}
      run_id: {type: string}
      failure: {type: string}
    routes:
      - to: proceed

  - name: proceed
    type: script
    description: Whether preparation settled enough to implement (its own answer, from this attempt's file)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/proceed.py", "{{ prepare_agent.output.produced }}"]
    output:
      proceed: {type: string}
      why: {type: string}
    routes:
      - to: implement_agent
        when: "{{ proceed.output.proceed == 'yes' }}"
      - to: deliver

  - name: implement_agent
    type: script
    description: 구현 — the change and its tests, as devflow-implementer
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/stack/steps/broker_dispatch.py", "{{ route_impl.output.provider }}",
           "{{ route_impl.output.model_route }}", "implement", "{{ work.output.prompt_implement }}",
           "devflow/implement.json", "{{ route_impl.output.profile }}", "{{ route_impl.output.login }}",
           "devflow-implementer"]
    timeout: 3700
    output:
      status: {type: string}
      produced: {type: boolean}
      provider: {type: string}
      run_id: {type: string}
      failure: {type: string}
    routes:
      - to: deliver

  - name: deliver
    type: script
    description: Scope by the canonical rules, the project's generators, one commit on devflow/<task>, its pull request (guarded)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/deliver.py", "{{ workflow.input.project }}", "{{ work.output.stage }}",
           "{% if prepare_agent is defined %}{{ prepare_agent.output.produced }}{% endif %}",
           "{% if prepare_agent is defined %}{{ prepare_agent.output.run_id }}{% endif %}",
           "{% if implement_agent is defined %}{{ implement_agent.output.produced }}{% endif %}",
           "{% if implement_agent is defined %}{{ implement_agent.output.run_id }}{% endif %}",
           "{% if research_agent is defined %}{{ research_agent.output.produced }}{% endif %}",
           "{% if research_agent is defined %}{{ research_agent.output.run_id }}{% endif %}"]
    timeout: 1500
    output:
      status: {type: string}
      delivered: {type: string}
      head: {type: string}
      pr: {type: string}
      hold: {type: string}
      failure: {type: string}
      error: {type: string}
    routes:
      - to: publish

  - name: integrate
    type: script
    description: Serialize on shared artifacts, re-check the head and canonical, merge or hand to the merge owner (guarded)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/integrate.py", "{{ workflow.input.project }}"]
    output:
      status: {type: string}
      merged: {type: string}
      ready: {type: string}
      phase: {type: string}
      progress: {type: string}
      detail: {type: string}
      error: {type: string}
    routes:
      - to: publish

  - name: publish
    type: script
    description: The state on the task's issue and the verdict on the head commit (guarded)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/packages/devflow/steps/publish.py", "{{ workflow.input.project }}"]
    output:
      status: {type: string}
      published: {type: string}
      did: {type: string}
      skipped: {type: string}
      evidence_index: {type: string}
      verdict: {type: string}
      phase: {type: string}
      progress: {type: string}
      next: {type: string}
      wait: {type: string}
      owner: {type: string}
      error: {type: string}
    routes:
      - to: record

  - name: record
    type: script
    description: Record the run (never changes its outcome)
    command: "${POC_PY:-/opt/venv/bin/python}"
    args: ["/work/stack/steps/record.py"]
    stdin: "{{ {'receipts': ([reviews.output.receipt] if reviews is defined else []), 'check': {'decision': publish.output.verdict, 'reason': (publish.output.next or adjudicate.output.reason), 'file_sha256': ''}, 'evidence_file': publish.output.evidence_index, 'measurements': {'model_calls': adjudicate.output.model_calls}, 'route': (route.output if route is defined else {'decision': 'NOT_NEEDED', 'reason': 'no model review was needed or allowed in this run'})} | tojson }}"
    output:
      mlflow_run_id: {type: string}
      experiment_id: {type: string}
      executions: {type: number}
      children: {type: number}
      record_error: {type: string}
    routes:
      - to: ended_tool_failure
        when: "{{ adjudicate.output.status == 'TOOL_FAILURE' or publish.output.status == 'TOOL_FAILURE' or (integrate is defined and integrate.output.status == 'TOOL_FAILURE') or (work is defined and work.output.status == 'TOOL_FAILURE') or (deliver is defined and deliver.output.status == 'TOOL_FAILURE') }}"
      - to: ended_done
        when: "{{ publish.output.phase == 'done' }}"
      - to: ended_verdict

  # Terminal names describe the run, not the work: a run that correctly concludes REQUEST_CHANGES
  # succeeded. Only a run whose machinery failed ends as failed — and its verdict stays undecided.
  - name: ended_done
    type: terminate
    status: success
    reason: "done: {{ adjudicate.output.verdict }} — integrated and verified"

  - name: ended_verdict
    type: terminate
    status: success
    reason: "{{ publish.output.verdict }} · {{ publish.output.phase }} · {{ publish.output.progress }}: {{ publish.output.next }}"

  - name: ended_tool_failure
    type: terminate
    status: failed
    reason: "TOOL_FAILURE (verdict {{ adjudicate.output.verdict }}): {{ adjudicate.output.error }} {{ publish.output.error }}{% if work is defined %} {{ work.output.error }}{% endif %}{% if deliver is defined %} {{ deliver.output.error }}{% endif %}"

output:
  project: "{{ workflow.input.project }}"
  issue: "{{ workflow.input.issue }}"
  frame: "{{ evaluate.output.frame }}"
  head: "{{ evaluate.output.head }}"
  need_models: "{{ evaluate.output.need_models }}"
  verdict: "{{ publish.output.verdict }}"
  phase: "{{ publish.output.phase }}"
  progress: "{{ publish.output.progress }}"
  next: "{{ publish.output.next }}"
  wait: "{{ publish.output.wait }}"
  owner: "{{ publish.output.owner }}"
  published: "{{ publish.output.published }}"
  state: "{{ adjudicate.output.state }}"
  acted: "{{ act.output.do }}: {{ act.output.why }}"
  delivered: "{% if deliver is defined %}{{ deliver.output.delivered }} {{ deliver.output.head }} PR {{ deliver.output.pr }} {{ deliver.output.failure }}{% endif %}"
  decision: "{{ publish.output.verdict }}"
  mlflow_run_id: "{{ record.output.mlflow_run_id }}"
  record_error: "{{ record.output.record_error }}"
