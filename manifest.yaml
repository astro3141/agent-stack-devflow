# devflow — one development workflow for every project, configured per project.
#
# 준비 → 구현 → 검증·리뷰 → 통합·출시 → 완료 (개발 범용 워크플로 v0.1). What is common lives here;
# what is one project's — its official criteria, its change classes, its checks, its shared
# generated artifacts, its extra review lenses — lives in that project's repository as a policy
# file and a hook (.devflow/), read at the canonical commit, and the project is registered in
# config/devflow/projects/<name>.yaml. Nothing in this package names a project.
#
# The execution profile (`profile`, config/profiles/) says which provider may run a model review
# and under which quota. The project policy says what the work must satisfy. Neither decides the
# other.
name: devflow
version: 0.1.0
description: Development workflow — prepare, implement, review, judge and integrate a task on GitHub
workflows:
  devflow: devflow.yaml            # one pass over a task: judge it, and act on it when devflow may
  devflow-auto: devflow-auto.yaml  # passes, one after another, until a person or CI has the next move
requires:
  # The hosts this package's scripts reach, declared so the allowlist can be read back (agent-stack
  # OPERATIONS §45). Declaring does not open them: the allowlist is the operator's file and it is
  # shared, so anything opened here is reachable by every other package too. Script steps do not run
  # as a role; the research hosts are the researcher role's (principals.yaml, §48), not these.
  egress:
    - github.com
    - api.github.com
    - codeload.github.com
  # egress: the remote (GitHub) and the model providers. tool_rights: a model review writes its
  # file through Preloop under the reviewer principal. Admission is deliberately not required at
  # start: whether a run needs a model is known only after evaluate, and a router HOLD then means
  # "no model review in this run" (the reviews stay missing and the state says so) — not a refusal
  # of a run that may need no model at all.
  capabilities: [tool_rights, egress]
  principals: [devflow-reviewer, devflow-implementer, devflow-researcher]
  # What this package needs in the environment, declared so the operator is told before a run
  # instead of by a step's error several minutes in. Names and purposes only: the value is the
  # operator's, it arrives from a git-ignored file on the host, and nothing here ever reads it
  # (agent-stack OPERATIONS §43). A run against the fixture remote needs none of this.
  #
  # GitHub needs one of the two: the Client ID behind the panel's 연결 (below), or a token.
  env:
    - name: DEVFLOW_GITHUB_CLIENT_ID
      purpose: the Client ID of the GitHub App (or OAuth App) the 연결 button logs in through — not a secret
      file: docker/package.env
    - name: DEVFLOW_GITHUB_TOKEN
      purpose: instead of 연결 — a token to read the project's issues and pull requests, push devflow's branch, write reviews and statuses
      file: docker/package.env

# GitHub, connected from the panel (OPERATIONS §44): the operator presses 연결, opens GitHub's page,
# types the code the panel shows. steps/github_login.py runs that device flow and writes token.json
# into this login's directory; only devflow's steps read it (lib/ghauth.py), and a token that
# expires is refreshed there. DEVFLOW_GITHUB_TOKEN in docker/package.env still works instead.
login:
  purpose: GitHub — read the task, push devflow's branch, open its pull request, publish the verdict
  argv: [/opt/venv/bin/python, /work/packages/devflow/steps/github_login.py]
  home_env: [DEVFLOW_GITHUB_HOME]
  done_when:
    file: token.json
